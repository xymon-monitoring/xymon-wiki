name: Project activity page

# Regenerates docs/about/project-activity.md once a month from the GitHub API.
# A push made with GITHUB_TOKEN does not start other workflows, so this one
# starts the docs deployment itself.

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: project-activity
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The groups table needs org membership, read through the
      # xymon-wiki-activity GitHub App (Members: read). Without the app the
      # page is still written and says that table is unavailable.
      - name: Get an org token from the GitHub App
        id: app
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ORG_APP_ID }}
          private-key: ${{ secrets.ORG_APP_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Generate the page
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: tools/project-activity.sh

      - name: Commit and deploy if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$(git status --porcelain -- docs/about/project-activity.md)" ] || { echo "no change"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/about/project-activity.md
          git commit -m "about: regenerate the project activity page"
          git push
          gh workflow run docs.yml --ref main
